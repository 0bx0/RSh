[metadata]
name = rsh
version = 1.0.0
description = RSh - an interactive REPL that eliminates build/source/run friction for ROS2
license = MIT

[options]
packages = find:
python_requires = >=3.10
install_requires =
    prompt-toolkit>=3.0

[options.packages.find]
include = rsh*

[options.entry_points]
console_scripts =
    rsh = rsh.__main__:cli
