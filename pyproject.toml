[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsh"
version = "0.2.0"
description = "random repl thingy i made for ros2"
requires-python = ">=3.10"
dependencies = [
    "prompt-toolkit>=3.0",
]

[project.scripts]
rsh = "rsh.__main__:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["rsh*"]
